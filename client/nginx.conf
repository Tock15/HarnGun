# Same paths as vite.config.ts, so the browser sees one origin and needs no CORS.
server {
    listen 80;
    root /usr/share/nginx/html;

    # Photos are capped at 5 MB by the client; the presigned POST adds form fields.
    client_max_body_size 6m;

    location / {
        try_files $uri $uri/ =404;
    }

    # No trailing slash: the backend's routes keep the /api/ prefix.
    location /api/ {
        proxy_pass http://backend:3000;
    }

    location /harngun-receipts {
        proxy_pass http://storage:9000;
    }
}
