# Full stack: `docker compose up --build`, then open http://localhost:8080.
# Only the frontend is published; the other three are reachable only inside the compose network.
services:
  frontend:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      DATABASE_ENDPOINT: http://database:8000
      TABLE_NAME: HarnGun_Main
      S3_ENDPOINT: http://storage:9000
      S3_PUBLIC_ENDPOINT: http://localhost:8080
      S3_BUCKET: harngun-receipts
      S3_FORCE_PATH_STYLE: "true"
      S3_ACCESS_KEY_ID: harngun-dev
      S3_SECRET_ACCESS_KEY: harngun-dev-secret
      AUTH: dev
      DEV_AUTH_SECRET: dev-only-not-a-secret
      MOCK_AI: "true"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      database:
        condition: service_healthy
      storage:
        condition: service_healthy

  database:
    image: amazon/dynamodb-local:3.3.1
    command: -jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/data
    # The image runs as uid 1000, but a new named volume is owned by root.
    user: root
    volumes:
      - db_data:/home/dynamodblocal/data
    healthcheck:
      # Any HTTP reply (a GET returns 400) means the server is up.
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://localhost:8000"]
      interval: 5s
      timeout: 3s
      retries: 10

  storage:
    image: rustfs/rustfs:1.0.1
    environment:
      RUSTFS_ACCESS_KEY: harngun-dev
      RUSTFS_SECRET_KEY: harngun-dev-secret
    volumes:
      - storage_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db_data:
  storage_data:
